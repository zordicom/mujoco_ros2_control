# Controller configuration for 2-DOF planar arm (horizontal double pendulum)

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    zordi_joint_effort_controller:
      type: zordi_ros_controllers/ZordiJointController

    zordi_joint_effort_rnea_controller:
      type: zordi_ros_controllers/ZordiJointRNEAController

    zordi_joint_effort_grav_comp_controller:
      type: zordi_ros_controllers/ZordiJointController

    zordi_cartesian_effort_controller:
      type: zordi_ros_controllers/ZordiCartesianController

    zordi_cartesian_effort_rnea_controller:
      type: zordi_ros_controllers/ZordiCartesianRNEAController

    zordi_cartesian_ik_controller:
      type: zordi_ros_controllers/ZordiCartesianIKController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Joint state broadcaster
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

# Zordi Joint Effort Controller (Trajectory Tracking with Software PD)
zordi_joint_effort_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # Trajectory tracking mode with software PD
    gravity_comp_only: false  # Enable trajectory tracking
    use_gravity_compensation: true  # Enable Pinocchio (gravity torques will be zero in zero-g)
    compute_pd_internally: true  # Use software PD (loads gains from URDF)

# Zordi Cartesian Controller
zordi_cartesian_effort_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    command_interfaces:
      # - position  # Disabled: Testing pure torque control
      # - velocity  # Disabled: MuJoCo neutralizes with qd in MIT mode, causing instability
      - effort

    state_interfaces:
      - position
      - velocity

    # Control mode
    compute_pd_internally: true  # Use software PD (pure torque control)

    # Frames
    end_effector_frame: "ee_link"
    base_frame: "base_link"

    # Cartesian stiffness (Moderate for stable tracking)
    stiffness:
      translation:
        x: 200.0  # N/m (increased for better convergence)
        y: 200.0  # N/m (increased for better convergence)
        z: 0.0     # Not used (planar XY)
      rotation:
        x: 0.0     # Not used (planar)
        y: 0.0     # Not used (planar)
        z: 20.0   # Nm/rad (increased for better convergence)

    # Cartesian damping (auto-compute for critical damping)
    damping:
      translation:
        x: 0.0  # Auto: 2*sqrt(200) ≈ 28.3
        y: 0.0  # Auto: 2*sqrt(200) ≈ 28.3
        z: 0.0
      rotation:
        x: 0.0
        y: 0.0
        z: 0.0  # Auto: 2*sqrt(20) ≈ 8.9

    # Nullspace control (posture)
    nullspace:
      stiffness: 5.0
      damping: 0.0  # Auto-compute
      weights: [1.0, 1.0]
      projector_type: "dynamic"  # Use dynamic nullspace projection

    # Control features
    use_operational_space: false
    use_gravity_compensation: false  # No gravity in simulation
    use_coriolis_compensation: false

    # Safety limits
    torque_limits: [50.0, 25.0]  # Nm
    max_cartesian_velocity: 1.0  # m/s
    max_cartesian_acceleration: 5.0  # m/s²

# Zordi Cartesian RNEA Controller (with full inverse dynamics)
zordi_cartesian_effort_rnea_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # Control mode
    compute_pd_internally: true  # Use software PD (pure torque control)

    # Frames
    end_effector_frame: "ee_link"
    base_frame: "base_link"

    # Cartesian stiffness (same as base controller)
    stiffness:
      translation:
        x: 200.0
        y: 200.0
        z: 0.0
      rotation:
        x: 0.0
        y: 0.0
        z: 20.0

    # Cartesian damping (auto-compute for critical damping)
    damping:
      translation:
        x: 0.0
        y: 0.0
        z: 0.0
      rotation:
        x: 0.0
        y: 0.0
        z: 0.0

    # Nullspace control
    nullspace:
      stiffness: 5.0
      damping: 0.0
      weights: [1.0, 1.0]
      projector_type: "dynamic"

    # Control features (RNEA uses full inverse dynamics)
    use_operational_space: false
    use_gravity_compensation: false  # No gravity in simulation
    use_coriolis_compensation: false

    # Safety limits
    torque_limits: [50.0, 25.0]  # Nm
    max_cartesian_velocity: 1.0  # m/s
    max_cartesian_acceleration: 5.0  # m/s²

# Zordi Joint Effort RNEA Controller (Joint space with full inverse dynamics)
zordi_joint_effort_rnea_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # RNEA mode with full inverse dynamics
    gravity_comp_only: false
    use_gravity_compensation: true  # Enable Pinocchio (gravity torques will be zero in zero-g)
    compute_pd_internally: true  # Use software PD (loads gains from URDF)

# Zordi Joint Effort Gravity Compensation Controller (Pure gravity comp, no trajectory tracking)
zordi_joint_effort_grav_comp_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # Pure gravity compensation mode (fully backdrivable)
    gravity_comp_only: true
    use_gravity_compensation: true  # Enable Pinocchio (gravity torques will be zero in zero-g)
    compute_pd_internally: false  # No PD needed in gravity comp only mode

# Zordi Cartesian IK Controller (Cartesian to Joint via IK)
# Note: IK controller does NOT claim command/state interfaces (forwards to JTC)
zordi_cartesian_ik_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    # Frames
    end_effector_frame: "ee_link"
    base_frame: "base_link"

    # Target JTC to forward commands to (any controller with FollowJointTrajectory action)
    # Can be: zordi_joint_effort_controller, zordi_joint_mit_controller,
    #         joint_trajectory_controller (ROS native), etc.
    target_controller: "joint_trajectory_controller"

    # IK solver parameters
    ik:
      max_iterations: 1000
      tolerance: 5.0e-4  # 100 micrometers - practical tolerance (errors ~50um converge quickly)
      damping: 0.01
      step_size: 1.0

    # Nullspace optimization (not used for 2-DOF, not redundant)
    nullspace:
      enabled: false
      gain: 0.5
      # preferred_config: []  # Commented out - not needed for 2-DOF

    # Joint limits
    joint_limits:
      margin: 0.05
      use_urdf_limits: true

    # Trajectory timing
    default_waypoint_duration: 2.0

# ROS Native Joint Trajectory Controller
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    # Use position interface (ROS native JTC doesn't support mixing interfaces)
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
