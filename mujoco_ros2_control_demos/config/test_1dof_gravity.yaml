# 1-DOF Gravity Compensation Test Configuration
#
# Tests zordi_ros_controllers with gravity compensation on vertical pendulum.
# Expected: Pendulum holds upright position (q=0) without falling.

controller_manager:
  ros__parameters:
    update_rate: 1000  # 1kHz to match timestep=0.001

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    zordi_joint_effort_grav_comp_controller:
      type: zordi_ros_controllers/ZordiJointController

    zordi_joint_mit_controller:
      type: zordi_ros_controllers/ZordiJointController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100

# Zordi Gravity Compensation Only Controller
# This controller ONLY applies gravity compensation torques (no PD control)
# The pendulum will be backdrivable and hold position purely via gravity compensation
zordi_joint_effort_grav_comp_controller:
  ros__parameters:
    joints:
      - j1

    # Gravity comp only mode - pure gravity compensation, no trajectory tracking
    gravity_comp_only: true

    # Claim only effort interface (no position/velocity)
    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # Enable gravity compensation (required)
    use_gravity_compensation: true

# Zordi Joint MIT Controller (for trajectory tracking with gravity compensation)
# This controller claims all three interfaces (position, velocity, effort) to enable MIT mode
zordi_joint_mit_controller:
  ros__parameters:
    joints:
      - j1

    # MIT mode - all three interfaces for trajectory tracking with gravity comp
    command_interfaces:
      - position
      - velocity
      - effort

    state_interfaces:
      - position
      - velocity

    # Enable gravity compensation
    use_gravity_compensation: true

    # Allow goal tolerance for trajectory execution
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

    # Tolerances for trajectory execution
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

    j1:
      trajectory: 0.05
      goal: 0.05

# Physics for this pendulum:
#   Mass: 1.0 kg
#   COM: 0.5 m below pivot
#   Max gravity torque: τ_g = m*g*r = 1.0*9.81*0.5 = 4.9 Nm (when horizontal)
#
# Without gravity comp: pendulum will fall to q=-π/2 (hanging down)
# With gravity comp: pendulum holds at q=0 (upright)
