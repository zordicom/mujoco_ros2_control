# Position Servo Example Controller Configuration
# Uses ros2_controllers/joint_trajectory_controller in position-only mode

controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

# Standard JTC in position mode (like controlling a Dynamixel servo)
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1

    # Position-only: servo handles PD internally
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # JTC uses its own internal PID (not MuJoCo's)
    # These gains are for the controller, not the simulated servo
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

    joint1:
      trajectory: 0.1
      goal: 0.05

